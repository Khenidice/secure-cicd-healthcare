name: Secure CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------
  #  1. Dependency installation
  # ---------------------------------------------------------------------
  install:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

  # ---------------------------------------------------------------------
  #  2. Automated testing (unit + integration, Django test suite)
  # ---------------------------------------------------------------------
  test:
    needs: install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run automated tests
        run: |
          python manage.py test --verbosity 2
      - name: Run with pytest + XML report
        run: |
          pytest --junitxml=test-results.xml -q
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: test-results.xml

  # ---------------------------------------------------------------------
  #  3. Security Gate (SAST) - blocks HIGH/CRITICAL severity findings
  # ---------------------------------------------------------------------
  sast:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install Bandit
        run: pip install bandit
      - name: SAST scan with Bandit
        id: sast
        run: |
          bandit -r hospital --exclude tests.py,migrations \
                 -f json -o bandit-report.json
      - name: Security Gate - block HIGH/CRITICAL
        run: |
          python security_gate.py bandit-report.json
      - name: Upload Bandit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sast-report
          path: bandit-report.json

  # ---------------------------------------------------------------------
  #  4. Container build + Trivy image scan
  # ---------------------------------------------------------------------
  build-and-scan:
    needs: sast
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: ghcr.io/${{ github.repository }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Scan image with Trivy
        run: |
          trivy image --severity CRITICAL,HIGH --exit-code 1 --ignore-unfixed \
            ghcr.io/${{ github.repository }}:${{ github.sha }}
      - name: Push image to registry
        run: docker push ghcr.io/${{ github.repository }}:${{ github.sha }}

  # ---------------------------------------------------------------------
  #  5. Deploy (with migrations, health check and rollback)
  # ---------------------------------------------------------------------
  deploy:
    needs: [ test, sast, build-and-scan ]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - name: Deploy container
        run: |
          docker pull ghcr.io/${{ github.repository }}:${{ github.sha }}
          docker stop hospital-app || true
          docker rm hospital-app || true
          docker run -d --name hospital-app \
            --env-file .env -p 8000:8000 \
            ghcr.io/${{ github.repository }}:${{ github.sha }}
      - name: Apply database migrations
        run: docker exec hospital-app python manage.py migrate --noinput
      - name: Health check + rollback on failure
        run: |
          curl -f http://localhost:8000/health || {
            echo "Health check failed - rolling back to stable";
            docker stop hospital-app || true
            docker run -d --name hospital-app \
              --env-file .env -p 8000:8000 \
              ghcr.io/${{ github.repository }}:stable;
            exit 1;
          }
      - name: Tag release stable
        run: |
          docker tag ghcr.io/${{ github.repository }}:${{ github.sha }} \
            ghcr.io/${{ github.repository }}:stable
          docker push ghcr.io/${{ github.repository }}:stable
